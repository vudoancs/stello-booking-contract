name: Setup Contract CI
description: Install Rust (fmt/clippy/wasm32v1-none) and pinned Stellar CLI 28.0.0 (toolchain only; no deploy secrets)

inputs:
  stellar_cli_version:
    description: Stellar CLI version to install (must match the action tag pin)
    required: false
    default: "28.0.0"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32v1-none

    # Official composite action from stellar/stellar-cli releases.
    # Tag v28.0.0 + explicit version input → downloads that release tarball
    # (never silently falls back to "latest").
    - name: Install Stellar CLI
      uses: stellar/stellar-cli@v28.0.0
      with:
        version: ${{ inputs.stellar_cli_version }}

    - name: Print and assert tool versions
      shell: bash
      run: |
        set -euo pipefail
        rustc --version
        cargo --version
        STELLAR_VER="$(stellar --version)"
        printf '%s\n' "${STELLAR_VER}"
        EXPECTED="${{ inputs.stellar_cli_version }}"
        if ! printf '%s\n' "${STELLAR_VER}" | grep -E -q "${EXPECTED//./\\.}"; then
          echo "::error::Expected Stellar CLI ${EXPECTED}, got: ${STELLAR_VER}"
          exit 1
        fi
